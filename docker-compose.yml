services:
  lavalink:
    build:
      context: .
      dockerfile: lavalink/Dockerfile
    image: deejay-lavalink:local
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "2333:2333"
